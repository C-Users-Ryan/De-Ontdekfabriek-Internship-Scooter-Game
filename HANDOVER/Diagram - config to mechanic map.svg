<text x="236" y="550" font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" font-size="13.5" font-weight="700" fill="#1f2328">SessionConfig<tspan fill="#2563eb">.endlessLives</tspan></text>
<text x="236" y="568" font-size="10" fill="#57606a">same <tspan font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace">SessionConfig</tspan> asset as the timed session</text>
