<svg viewBox="0 0 820 772" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">
<title>Config to mechanic map — which ScriptableObject asset governs which mechanic</title>
<desc>A lookup map from each game mechanic to the ScriptableObject config asset that governs it, with key fields. Traffic maps to TrafficConfig plus a per-archetype TrafficBehaviourProfile (density, per-type speeds, personality biases). Day and night maps to DayCycleConfig (the phase list including the blue-hour MAGHARIBI phase, and dawn and dusk timing). Scoring and streak maps to ScoreConfig (base points, streak multiplier), plus two knobs that live elsewhere: per-hazard deductions on each HazardSpawnConfig, and overtake base points on the vehicle prefab. Safety net maps to SafetyNetConfig (grace charges, rewind window, hit thresholds). Timed session and checkpoint relay map to SessionConfig (sessionSeconds, checkpoint lead) plus ChargeStationSequence. Endless lives map to SessionConfig.endlessLives, default 3. Simple one-to-one mappings: drive side and lanes to RoadSideConfig, scooter feel to ScooterConfig, controls to InputConfig, audio to AudioConfig, and per-tile surface and roughness on the RoadTile itself. The rule: everything is a ScriptableObject asset tuned in the Inspector; the number in the code is only the default that seeds a brand-new asset, so edit the asset, not the code.</desc>
<rect x="0" y="0" width="820" height="772" fill="#ffffff"></rect>
<defs><marker id="h3ar" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#57606a"></path></marker></defs>

<text x="410" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Config → mechanic map — where each tunable lives</text>
<text x="410" y="49" text-anchor="middle" font-size="12" fill="#57606a">each mechanic points to the ScriptableObject <tspan font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace">.asset</tspan> that governs it, with its key fields</text>


<rect x="40" y="60" width="740" height="66" rx="8" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-opacity="0.35" stroke-width="1.3"></rect>
<rect x="40" y="60" width="4" height="66" fill="#2563eb"></rect>
<text x="58" y="82" font-size="11.5" font-weight="700" fill="#1f2328">Everything is a ScriptableObject <tspan font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace">.asset</tspan> — tune it in the Inspector.</text>
<text x="58" y="100" font-size="10.5" fill="#57606a">The number in the <tspan font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace">.cs</tspan> is only the default that seeds a brand-new asset; the shipped <tspan font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace">.asset</tspan> keeps its own</text>
<text x="58" y="116" font-size="10.5" fill="#57606a">serialized value — so edit the asset, not the code.</text>


<rect x="40" y="153" width="150" height="42" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1.3"></rect>
<text x="115" y="178" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328">Traffic</text>
<path d="M192,174 H212" stroke="#57606a" stroke-width="1.6" marker-end="url(#h3ar)"></path>
<rect x="220" y="138" width="560" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"></rect>
<text x="236" y="168" font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1f2328">TrafficConfig</text>
<rect x="356" y="152" width="286" height="22" rx="6" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-opacity="0.3"></rect>
<text x="368" y="167" font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" font-size="10.5" fill="#2563eb">+ TrafficBehaviourProfile · per archetype</text>
<text x="236" y="193" font-size="10.5" fill="#57606a">density · per-type speeds · personality biases</text>


