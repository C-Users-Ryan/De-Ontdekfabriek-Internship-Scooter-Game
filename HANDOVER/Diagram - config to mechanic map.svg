<text x="236" y="434" font-size="10.5" fill="#57606a">grace charges · rewind window · hit thresholds</text>


<rect x="40" y="464" width="150" height="42" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1.3"></rect>
