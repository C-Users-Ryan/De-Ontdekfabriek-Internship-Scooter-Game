<text x="115" y="495" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2328">checkpoint relay</text>
<path d="M192,485 H212" stroke="#57606a" stroke-width="1.6" marker-end="url(#h3ar)"></path>
<rect x="220" y="452" width="560" height="66" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.4"></rect>
<text x="236" y="482" font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#1f2328">SessionConfig</text>
