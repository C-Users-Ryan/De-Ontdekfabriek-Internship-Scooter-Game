<text x="482" y="322" font-size="10" fill="#57606a">→ on each <tspan font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" fill="#2563eb">HazardSpawnConfig</tspan></text>
<rect x="470" y="334" width="294" height="34" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="4 3"></rect>
<text x="482" y="348" font-size="10" font-weight="600" fill="#1f2328">overtake base points</text>
<text x="482" y="362" font-size="10" fill="#57606a">→ on the <tspan fill="#2563eb">vehicle prefab</tspan></text>


<rect x="40" y="394" width="150" height="42" rx="8" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1.3"></rect>
<text x="115" y="411" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2328">Safety net</text>
<text x="115" y="425" text-anchor="middle" font-size="9" fill="#57606a">grace + rewind</text>
