<circle cx="62" cy="674" r="2.6" fill="#2563eb"></circle>
<text x="74" y="678" fill="#1f2328">Scooter feel <tspan fill="#adb5bd">→</tspan> <tspan font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" font-weight="600" fill="#2563eb">ScooterConfig</tspan></text>
<circle cx="62" cy="704" r="2.6" fill="#2563eb"></circle>
<text x="74" y="708" fill="#1f2328">Controls <tspan fill="#adb5bd">→</tspan> <tspan font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" font-weight="600" fill="#2563eb">InputConfig</tspan></text>
<circle cx="422" cy="644" r="2.6" fill="#2563eb"></circle>
<text x="434" y="648" fill="#1f2328">Audio <tspan fill="#adb5bd">→</tspan> <tspan font-family="ui-monospace,&#39;SF Mono&#39;,Menlo,Consolas,monospace" font-weight="600" fill="#2563eb">AudioConfig</tspan></text>
<circle cx="422" cy="686" r="2.6" fill="#2563eb"></circle>
<text x="434" y="690" fill="#1f2328">Per-tile surface &amp; roughness</text>
<text x="434" y="706" fill="#57606a">→ <tspan font-weight="600" fill="#2563eb">on the RoadTile itself</tspan> (not a separate asset)</text>
