<svg viewBox="0 0 820 540" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">
<title>Recommendations triage — keep, change or finish, and keep in mind</title>
<desc>A three-column triage board. KEEP (green) — solid, don&#39;t rewrite: data-driven architecture (new hazard, tile or mode is an asset); facilitator settings plus override plus Profielen plus PIN recovery; point-based RoadTile turns; the single-fixed-camera rule; the honesty guardrails. CHANGE or FINISH (amber) — before real deployment: set the real Android app id, create and back up the keystore and lock LandscapeLeft to a final signed APK; on-device kiosk and gyro-sign test; import the roughly 30 audio clips with a per-clip licence manifest; rename the Tests tilde folder so the EditMode tests run; a documented mirror-to-live sync checklist; a native-Swahili review. KEEP IN MIND (blue) — risks that aren&#39;t bugs: the leaderboard is per-tablet and wiped by a re-signed APK; the deployed control format is still open (plain tablet versus Arduino rig); older-tablet performance is untested at scale; several done items are mirror-only until recompiled. A footer notes what shipped in the July 2026 pass, all needing a Unity recompile and none device-tested yet.</desc>
<rect x="0" y="0" width="820" height="540" fill="#ffffff"></rect>

<text x="410" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2328">Recommendations — a triage board</text>
<text x="410" y="49" text-anchor="middle" font-size="12" fill="#57606a">what to keep, what to finish before deployment, and what to keep in mind</text>


