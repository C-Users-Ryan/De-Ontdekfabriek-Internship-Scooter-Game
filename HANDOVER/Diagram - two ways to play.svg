<svg viewBox="0 0 820 700" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">
<title>Two ways to play — one title screen, two game modes</title>
<desc>From one title screen (a big orange ANZA! pill with a smaller outlined VRIJ RIJDEN · ENDLESS button beneath it) the game branches into two modes. Left, the Klassenrelay (ANZA!) team game — tagged teamspel, telt mee voor de klas: choose a team from a grid of Swahili animal cards (Simba, Twiga, Chui, Tembo, Faru) plus an accent EIGEN NAAM card that opens an on-screen keyboard, then a roughly 120-second turn on a clock, a charge-station hand-over to the next player, and a shared class leaderboard. Right, the Vrij rijden (Endless) solo game — tagged solo, telt NIET mee voor de klas: drive immediately with no team choice, three lives and a distance readout instead of a clock, a crash costs a life, and at zero lives SPEL VOORBIJ offers NOG EEN KEER or STOPPEN.</desc>
