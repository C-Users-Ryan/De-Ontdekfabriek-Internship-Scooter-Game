<text x="388" y="110" font-size="12" font-weight="700" letter-spacing="1.5" fill="#F19141">DE ZICHTBARE WEG TERUG</text>
<text x="388" y="128" font-size="11" fill="#C9B7A6">één knop · twee tikken</text>

