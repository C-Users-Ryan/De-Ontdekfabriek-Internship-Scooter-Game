<svg viewBox="0 0 820 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,&#39;Segoe UI&#39;,Roboto,Helvetica,Arial,sans-serif">
<title>Facilitator PIN recovery — the unlock keypad and the two ways back to the default code</title>
<desc>A simplified mock of the facilitator access-code keypad on the game&#39;s warm brand sheet: a round PIN padlock badge, the title TOEGANGSCODE, the prompt &#34;Voer de begeleiderscode in&#34;, a row of four entry dots with the first filled, a numeric keypad of keys one to nine with phone letters (three spells D, six O, eight T, three F — the default code 3683 = DOTF), a bottom row of WIS, zero and a cross, and a pinned &#34;Code vergeten? Tik om terug te zetten&#34; pill. To the right, a three-step recovery flow: tap &#34;Code vergeten?&#34;, it arms and warns &#34;Zeker? Tik nog eens — de code gaat terug naar de standaardcode&#34;, tap again and the status reads &#34;Code teruggezet naar de standaardcode&#34;. A legend notes the default code 3683 spells DOTF on a phone keypad, and a hidden second path: press and hold the padlock badge for four seconds does the same reset.</desc>
<rect x="0" y="0" width="820" height="600" fill="#1A1310"></rect>

<text x="44" y="44" font-size="12" font-weight="700" letter-spacing="1.5" fill="#F19141">BEGELEIDER · TOEGANGSCODE &amp; HERSTEL</text>
<text x="44" y="64" font-size="12" fill="#C9B7A6">De ontgrendel-keypad — en de twee wegen terug naar de standaardcode.</text>


