<text x="440" y="517" font-size="10.5" fill="#C9B7A6"><tspan font-weight="700" fill="#F19141">4 seconden</tspan> vast → dezelfde reset.</text>


<line x1="44" y1="552" x2="792" y2="552" stroke="#FFF6EC" stroke-opacity="0.1" stroke-width="1"></line>
<text x="410" y="573" text-anchor="middle" font-size="11" font-style="italic" fill="#C9B7A6">Een begeleider kan nooit buitengesloten raken: één zichtbare knop (twee tikken),</text>
<text x="410" y="589" text-anchor="middle" font-size="11" font-style="italic" fill="#C9B7A6">of het slotje 4 seconden vasthouden, zet de code terug naar de standaard.</text>
