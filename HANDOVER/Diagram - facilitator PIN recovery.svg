<text x="444" y="190" font-size="10.5" fill="#C9B7A6">de knop onderaan de keypad</text>
<path d="M590,206 V222" stroke="#8f7d6e" stroke-width="1.6" marker-end="url(#d1ar)"></path>


<rect x="388" y="224" width="404" height="76" rx="12" fill="#2A1E18" stroke="#F19141" stroke-width="1.5"></rect>
